{% extends 'base_auth.html' %}
{% load static %}

{% block content %}

<style>
  html, body {
    /* make sure it fills the viewport */
    min-height: 100vh;
    margin: 0;
    /* gradient from light-cyan to deep-blue */
    background: linear-gradient(
      to bottom,
      #00E5E5,
      #0057FF
    );
  }

  .card {
    background: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 87, 255, 0.1);
  }

  .card-title h4 {
    color: #0057FF;
    font-weight: 600;
  }

  .form-control {
    border: 1px solid rgba(0, 87, 255, 0.2);
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    border-color: #0057FF;
    box-shadow: 0 0 0 3px rgba(0, 87, 255, 0.1);
  }

  .submit-btn {
    background: #0057FF;
    border: none;
    border-radius: 8px;
    padding: 10px 0;
    transition: all 0.3s ease;
  }

  .submit-btn:hover {
    background: #0045cc;
    transform: translateY(-1px);
  }
</style>

<!-- Logo above the form -->
<div class="text-center pt-4">
  <img src="{% static 'img/cabudget_logo.png' %}"
       alt="Logo"
       class="img-fluid"
       style="max-width: 300px;">
</div>

<div class="row">
  <div class="col-md-4"></div>
  <div class="col-md-4">
    <div class="card mt-5">

      <div class="card-body">
        <div class="card-title py-3">
          <h4 class="text-center">Register for a free account</h4>
        </div>
        <form action="{% url 'register' %}" method="post">
          {% csrf_token %}

          {% include 'partials/_messages.html' %}
          <div class="form-group">
            <input
              type="text"
              name="username"
              placeholder="username"
              id="usernameField"
              value="{{fieldValues.username}}"
              class="form-control form-control-sm"
            />
          </div>
          <div class="invalid_feedback invalid-feedback" style="display:none">
          </div>
          <p class="text-sm text-success usernameSuccessOutput"></p>
          <div class="form-group">
            <input
              type="email"
              name="email"
              placeholder="Email"
              class="form-control form-control-sm"
              id="emailField"
              value="{{fieldValues.email}}"
            />
          </div>

          <div class="emailFeedBackArea invalid-feedback" style="display:none">
          </div>
          <div class="form-group">
            <input
              type="password"
              name="password"
              placeholder="Password"
              class="form-control form-control-sm"
              id="passwordField"
            />
            <small class="float-right py-3 showPasswordToggle">SHOW</small>
          </div>
          <input type="submit" value="Register" class="btn btn-block btn-primary submit-btn" />
        </form>

      </div>

      </div>
    </div>
  </div>
  <div class="col-md-4"></div>
</div>

<script src="{% static 'js/register.js' %}"></script>

{% endblock content %}
