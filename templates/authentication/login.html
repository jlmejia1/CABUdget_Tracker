{% extends 'base_auth.html' %}
{% load static %}


{% block content %}

<style>
  html, body {
    /* make sure it fills the viewport */
    min-height: 100vh;
    margin: 0;
    /* gradient from light sky blue to deeper blue */
    background: linear-gradient(
      to bottom,
      #00E5E5,  /* light-cyan */
      #0057FF   /* deep-blue */
    );
  }

  .card {
    background: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
    border-radius: 15px; /* Rounded corners */
    border: 1px solid rgba(255, 255, 255, 0.3); /* Light border */
    backdrop-filter: blur(10px); /* Glassmorphism effect */
    box-shadow: 0 8px 32px rgba(0, 87, 255, 0.1); /* Subtle shadow */
  }

  .card-title h4 {
    color: #0057FF; /* Use the deep blue from gradient */
    font-weight: 600;
  }

  .form-control {
    border: 1px solid rgba(0, 87, 255, 0.2); /* Subtle border */
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    border-color: #0057FF;
    box-shadow: 0 0 0 3px rgba(0, 87, 255, 0.1);
  }

  .submit-btn {
    background: #0057FF;
    border: none;
    border-radius: 8px;
    padding: 10px 0;
    transition: all 0.3s ease;
  }

  .submit-btn:hover {
    background: #0045cc;
    transform: translateY(-1px);
  }
</style>

<!-- Full-height container -->
<div class="container min-vh-100 d-flex flex-column justify-content-center">
  
  <!-- Centered logo -->
  <div class="text-center mb-4">
    <img src="{% static 'img/cabudget_logo.png' %}"
         alt="Logo"
         class="img-fluid"
         style="max-width: 300px;">
  </div>

  <!-- Centered card using Bootstrap grid -->
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">  <!-- Adjust column widths as needed -->
      <div class="card">
        <div class="card-body">
          <div class="card-title py-3">
            <h4 class="text-center">Login to your account</h4>
          </div>
          <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            {% include 'partials/_messages.html' %}
            
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Username"
                id="usernameField"
                value="{{fieldValues.username}}"
                class="form-control form-control-sm"
              />
            </div>
            
            <div class="form-group">
              <input
                type="password"
                name="password"
                placeholder="Password"
                class="form-control form-control-sm"
                id="passwordField"
              />
            </div>
            
            <input type="submit" value="Login" class="btn btn-block btn-primary submit-btn" />
            
            <p class="text-center mt-3">
              or <a href="{% url 'register' %}">Create Account</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/register.js' %}"></script>

{% endblock content %}
